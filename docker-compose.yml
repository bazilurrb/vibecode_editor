# docker-compose.yml
# Spins up a local PostgreSQL database for Prisma development.
#
# NOTE: The current schema.prisma uses MongoDB (provider = "mongodb").
# This docker-compose is provided for contributors who want to switch
# to PostgreSQL locally. To use it:
#   1. Change provider = "postgresql" in prisma/schema.prisma
#   2. Remove MongoDB-specific types (e.g. @db.ObjectId, @map("_id"))
#   3. Run: docker compose up -d
#   4. Set DATABASE_URL to the postgres connection string below
#   5. Run: npx prisma migrate dev --name init

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibecode_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vibecode_user
      POSTGRES_PASSWORD: vibecode_password
      POSTGRES_DB: vibecode
    volumes:
      - vibecode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecode_user -d vibecode"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin web UI to inspect your database
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vibecode_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vibecode.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres

volumes:
  vibecode_pgdata:
    driver: local

# =============================================================================
# PostgreSQL DATABASE_URL for your .env:
#
#   DATABASE_URL="postgresql://vibecode_user:vibecode_password@localhost:5432/vibecode"
#
# Quick start:
#   docker compose up -d       # start the DB
#   docker compose down        # stop the DB
#   docker compose down -v     # stop and delete all data
# =============================================================================
